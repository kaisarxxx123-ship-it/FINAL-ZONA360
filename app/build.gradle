plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zona360.salestracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zona360.salestracker'
        minSdk 26
        targetSdk 35
        versionCode 2026083108
        versionName '2.0.7-final-audited'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    // Capacitor native bridge. The exact existing web UI from the MASTER APK is kept under assets/public.
    implementation 'com.capacitorjs:core:7.4.5'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.15.0'

    // Native GPS for both foreground screen updates and the persistent foreground service.
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Native QR/barcode scanner. The Java plugin exposes the exact Capacitor plugin name
    // expected by the existing Zona360 web bundle: CapacitorBarcodeScanner.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    testImplementation 'junit:junit:4.13.2'
}
